server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: sales-management-system
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sales_management}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-missing-migrations: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
    
logging:
  level:
    org.springframework.web: INFO
    com.knoweb.salesmanagement: DEBUG

jwt:
  secret: ${JWT_SECRET:this_is_a_very_long_default_secret_key_for_local_dev_only_1234567890}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
