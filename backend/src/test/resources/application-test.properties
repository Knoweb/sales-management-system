spring.datasource.url=${TEST_DB_URL:jdbc:tc:postgresql:16:///sales_management_test}
spring.datasource.username=${TEST_DB_USERNAME:test}
spring.datasource.password=${TEST_DB_PASSWORD:test}
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=false
knoweb.database.init.enabled=false

app.encryption.secret-key=0123456789abcdef0123456789abcdef
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0